<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="{{lightpaper}}">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="{{darkpaper}}">
<meta name="description" content="{{description}}">
<title>{{title}}</title>
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<style>{{tokens}}</style>
<link rel="stylesheet" href="/assets/site.css?v={{cssversion}}">
{{workstyle}}<script defer src="/assets/site.js?v={{jsversion}}"></script>
</head>
<body data-page="{{page}}">
<a class="skip-link" href="#main-content">{{skip}}</a>
{{header}}
<main id="main-content" class="shell">{{content}}</main>
{{footer}}
</body>
</html>
